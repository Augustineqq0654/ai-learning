<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学习 · AI 学习驾驶舱</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body data-page="study">
    <nav class="nav">
      <div class="nav-inner">
        <a class="nav-brand" href="/">AI 学习驾驶舱</a>
        <div class="nav-links">
          <a class="nav-link" href="/">速览</a>
          <a class="nav-link active" href="/study.html">学习</a>
          <a class="nav-link" href="/projects.html">项目库</a>
          <a class="nav-link" href="/tutorials.html">教程</a>
        </div>
        <div class="nav-actions">
          <span class="streak" id="streak" hidden></span>
          <button class="btn btn-sm" id="refresh">更新</button>
        </div>
      </div>
    </nav>

    <div class="wrap">
      <header class="page-head">
        <h1>学习</h1>
        <p class="sub">当前阶段 · 每天只推一个任务</p>
      </header>

      <section class="block">
        <div class="block-head">
          <h2>我在这一步</h2>
          <div class="stage-switch" id="stage-switch"></div>
        </div>
        <div class="panel" id="stage-card"></div>
      </section>

      <section class="block">
        <div class="block-head">
          <h2>今日任务</h2>
          <span class="hint" id="task-hint"></span>
        </div>
        <div id="task-card"></div>
      </section>

      <footer class="foot">
        <span>进度只存在浏览器 · 换电脑不会同步</span>
      </footer>
    </div>

    <div class="toast" id="toast" hidden></div>
    <script src="/app.js"></script>
  </body>
</html>
